---
# Vespa アプリケーションパッケージを ConfigMap として定義
# services.xml と hosts.xml を含む
apiVersion: v1
kind: ConfigMap
metadata:
  name: vespa-app-services
  namespace: vespa
  labels:
    app.kubernetes.io/name: vespa
    app.kubernetes.io/component: app-package
data:
  services.xml: |
    <?xml version="1.0" encoding="utf-8" ?>
    <services version="1.0">

      <!-- 管理クラスター: コンフィグサーバー x3 で ZooKeeper クォーラムを形成 -->
      <admin version="2.0">
        <adminserver hostalias="node0"/>
        <configservers>
          <configserver hostalias="node0"/>
          <configserver hostalias="node1"/>
          <configserver hostalias="node2"/>
        </configservers>
        <logserver hostalias="node0"/>
        <slobroks>
          <slobrok hostalias="node0"/>
          <slobrok hostalias="node1"/>
          <slobrok hostalias="node2"/>
        </slobroks>
      </admin>

      <!-- コンテナークラスター: ドキュメントAPI と検索APIを提供 -->
      <container id="default" version="1.0">
        <document-api/>
        <search/>
        <nodes>
          <node hostalias="node0"/>
          <node hostalias="node1"/>
          <node hostalias="node2"/>
        </nodes>
      </container>

      <!-- コンテンツクラスター: 冗長化設定（redundancy=2）でデータを2ノードに複製 -->
      <content id="music" version="1.0">
        <redundancy>2</redundancy>
        <documents>
          <document type="music" mode="index"/>
        </documents>
        <nodes>
          <node hostalias="node0" distribution-key="0"/>
          <node hostalias="node1" distribution-key="1"/>
          <node hostalias="node2" distribution-key="2"/>
        </nodes>
      </content>

    </services>

  hosts.xml: |
    <?xml version="1.0" encoding="utf-8" ?>
    <hosts>
      <host name="vespa-0.vespa-internal.vespa.svc.cluster.local">
        <alias>node0</alias>
      </host>
      <host name="vespa-1.vespa-internal.vespa.svc.cluster.local">
        <alias>node1</alias>
      </host>
      <host name="vespa-2.vespa-internal.vespa.svc.cluster.local">
        <alias>node2</alias>
      </host>
    </hosts>

---
# スキーマ定義を別 ConfigMap に分離
apiVersion: v1
kind: ConfigMap
metadata:
  name: vespa-app-schemas
  namespace: vespa
  labels:
    app.kubernetes.io/name: vespa
    app.kubernetes.io/component: app-package
data:
  music.sd: |
    # 音楽ドキュメントスキーマ（日本語対応）
    schema music {
      document music {

        # 楽曲タイトル（日本語・英語対応）
        field title type string {
          indexing: summary | index
          index: enable-bm25
          summary: dynamic
        }

        # アーティスト名
        field artist type string {
          indexing: summary | index
          index: enable-bm25
        }

        # アルバム名
        field album type string {
          indexing: summary | index
          index: enable-bm25
        }

        # リリース年
        field year type int {
          indexing: summary | attribute
        }

        # ジャンル
        field genre type string {
          indexing: summary | attribute
        }

        # 歌詞（日本語テキスト検索対応）
        field lyrics type string {
          indexing: summary | index
          index: enable-bm25
          summary: dynamic
        }

        # 言語（日本語検索最適化のため）
        field language type string {
          indexing: summary | attribute
        }

      }

      # デフォルト検索フィールドセット
      fieldset default {
        fields: title, artist, album, lyrics
      }

      # ランキングプロファイル: BM25ベース
      rank-profile default inherits default {
        first-phase {
          expression: bm25(title) + bm25(artist) + bm25(lyrics)
        }
      }

      # タイトル重視ランキング
      rank-profile title-focused {
        first-phase {
          expression: bm25(title) * 2 + bm25(artist) + bm25(lyrics)
        }
      }

    }
