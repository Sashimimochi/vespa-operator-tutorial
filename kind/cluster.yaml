# kind クラスター設定 / kind cluster configuration
# Vespa の冗長クラスターを動かすために 4 つのワーカーノードを用意する
# 4 worker nodes to run a redundant Vespa cluster locally
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vespa
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
